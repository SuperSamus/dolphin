[OnFrame]
# The game has an idle loop with a few quirks that prevent Dolphin from detecting it as such.
#
# First, it calls with dynamic dispatch (preventing inlining) a function that... returns immediately. It doesn't seem to ever call anything else.
# Then, it adds 1 to a variable that counts how many times the loop was iterated... for some reason. This technically makes it not-an-idle-loop.
# Finally, it actually checks whether to exit the loop by reading a variable changed by the vblank interrupt.
#
# The patch shortens the loop to only contain the final part, allowing Dolphin to idle and improve the emulation performance.
# It seems that there are other idle loops idle in the game, since overclocking the emulated CPU still decreases performance even if the game
# was internally running at full speed. However, the performance improvement is still significant.
#
# The second line is for the Japanese version, while the first is for every other version.
$Idle loop speed hack
0x8063C050:dword:0x4082FFF0:0x00000000
0x8063C050:dword:0x4082FFF0:0x00000000

[OnFrame_Enabled]
$Idle loop speed hack

[Patches_RetroAchievements_Verified]
$Idle loop speed hack
